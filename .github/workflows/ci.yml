name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Each job runs the Makefile target a developer would, so a local run and a
# pipeline run check the same thing.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: make vet
      # Includes the generator's golden test, which fails when the
      # committed metadata differs from what resources/ produces.
      - run: make test
      - run: make vuln

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The export data decoder comes from the golang.org/x/tools version
      # golangci-lint pins, not from the Go toolchain that builds it, so
      # goinstall alone does not help. Go 1.27.3 writes export data V5,
      # and only x/tools >= v0.50.0 (golangci-lint >= v2.14.0) can read
      # it. Older versions fail typecheck with "export data version 5 is
      # greater than maximum supported version 4". goinstall stays so the
      # linter is never built with a Go older than go.mod targets.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall

  crap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # go-crap reads go list's JSON with its stderr mixed in, so the
      # "go: downloading" lines of a cold module cache break it. Download
      # what the packages and their tests need first.
      - run: go list -deps -test ./... > /dev/null
      - run: make crap

  # A 30-second run of every fuzz target on each push. The seed corpus and
  # testdata/fuzz already run as ordinary tests in the test job.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=30s
